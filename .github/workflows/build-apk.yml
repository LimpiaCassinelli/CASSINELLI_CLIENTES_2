name: Construir APK CASSINELLI CLIENTES

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            build-essential ccache \
            autoconf automake libtool libltdl-dev pkg-config \
            zlib1g-dev libffi-dev libssl-dev \
            libncurses5-dev libncursesw5-dev \
            cmake

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Compilar APK
        shell: bash
        run: buildozer -v android debug 2>&1 | tee build.log

      - name: Mostrar errores
        if: failure()
        shell: bash
        run: |
          N=$(grep -n "BUILD FAILED" build.log | head -1 | cut -d: -f1)
          echo "=== CAUSA (linea $N) ==="
          if [ -n "$N" ]; then sed -n "$((N-45)),$((N+2))p" build.log; fi
          echo "=== OTROS AVISOS ==="
          grep -n -i "Execution failed\|Could not\|Unsupported\|incompatible\|No such file" build.log | tail -15

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: CASSINELLI-CLIENTES-APK
          path: bin/*.apk
          if-no-files-found: error
